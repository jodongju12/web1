<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="jquery.lightbox.css">
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script src="jquery.lightbox.js"></script>
    <script>
        $(document).ready(
            function(){
                $("a.lightbox").lightBox();
            }
        
            
        );
    </script>
</head>
<body>
    <a class="lightbox" href="images/1.jpg"><img src="images/1.jpg" width="80"></a>
    <a class="lightbox" href="images/2.jpg"><img src="images/2.jpg" width="80"></a>
    <a class="lightbox" href="images/3.jpg"><img src="images/3.jpg" width="80"></a>
</body>
</html>
