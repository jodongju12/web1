<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOPRULU SECTOR : BROOD WAR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap');
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; user-select: none; cursor: crosshair; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #1a1a1a; }
        #gameCanvas {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; }
        .panel { background: rgba(10, 20, 30, 0.8); border: 2px solid #0aa; padding: 15px; color: #0ff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.2); }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 2px solid #f00; padding: 40px; text-align: center; color: #f00; z-index: 100; }
        .btn { background: #200; color: #f00; border: 1px solid #f00; padding: 10px 20px; font-family: 'Orbitron'; font-size: 18px; cursor: pointer; }
        .btn:hover { background: #f00; color: #000; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="panel" id="scoreBoard">TACTICAL VIEW<br><span style="color:#fff; font-size:14px;">WAVE: <span id="waveTxt">1</span> | KILLS: <span id="killTxt">0</span></span></div>
        <div class="panel" style="text-align: right; color:#aaa; font-size:14px;">
            <strong style="color:#f04;">[경고]</strong> 맹독충(초록색) 접근 주의<br>
            메딕(흰색) 자동 치유 / 탱크(회색) 광역 포격
        </div>
    </div>
    <div id="gameOver">
        <h1>SQUAD WIPED OUT</h1>
        <button class="btn" onclick="location.reload()">REDEPLOY SQUAD</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        const getDist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
        const getAngle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

        let gameActive = true, kills = 0, wave = 1, frameCount = 0;
        let isSelecting = false, startX = 0, startY = 0, currentX = 0, currentY = 0;
        
        let units = [], enemies = [], bullets = [], particles = [], healBeams = [], moveCommands = [];

        canvas.addEventListener('contextmenu', e => e.preventDefault());
        canvas.addEventListener('mousedown', e => {
            if (!gameActive) return;
            if (e.button === 0) { isSelecting = true; startX = e.clientX; startY = e.clientY; currentX = e.clientX; currentY = e.clientY; }
            else if (e.button === 2) {
                moveCommands.push({ x: e.clientX, y: e.clientY, life: 20 });
                units.forEach(u => { if (u.selected) u.setTarget(e.clientX, e.clientY); });
            }
        });
        canvas.addEventListener('mousemove', e => { if (isSelecting) { currentX = e.clientX; currentY = e.clientY; } });
        canvas.addEventListener('mouseup', e => {
            if (e.button === 0 && isSelecting) {
                isSelecting = false;
                let minX = Math.min(startX, currentX), maxX = Math.max(startX, currentX);
                let minY = Math.min(startY, currentY), maxY = Math.max(startY, currentY);
                let isClick = (maxX - minX < 5) && (maxY - minY < 5);
                units.forEach(u => u.selected = isClick ? (getDist(e.clientX, e.clientY, u.x, u.y) < u.radius + 5) : (u.x > minX && u.x < maxX && u.y > minY && u.y < maxY));
            }
        });

        // --- 플레이어 유닛 (Marine, Medic, Tank) ---
        class Unit {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.selected = false; this.isMoving = false; this.targetX = x; this.targetY = y;
                this.cd = 0;
                
                if (type === 'marine') { this.hp = 40; this.maxHp = 40; this.speed = 2.5; this.range = 180; this.cdTime = 12; this.radius = 10; this.color = '#00aaff'; }
                if (type === 'medic') { this.hp = 60; this.maxHp = 60; this.speed = 2.5; this.range = 150; this.cdTime = 10; this.radius = 10; this.color = '#ffffff'; }
                if (type === 'tank') { this.hp = 150; this.maxHp = 150; this.speed = 1.2; this.range = 300; this.cdTime = 70; this.radius = 16; this.color = '#888888'; }
            }

            setTarget(tx, ty) { this.targetX = tx + (Math.random()-0.5)*50; this.targetY = ty + (Math.random()-0.5)*50; this.isMoving = true; }

            update() {
                // 군집 회피 (Flocking)
                let sepX = 0, sepY = 0;
                units.forEach(other => {
                    if (other !== this) {
                        let d = getDist(this.x, this.y, other.x, other.y);
                        if (d < this.radius * 2.5) {
                            let angle = getAngle(other.x, other.y, this.x, this.y);
                            sepX += Math.cos(angle) * (this.radius * 2.5 - d) * 0.1; sepY += Math.sin(angle) * (this.radius * 2.5 - d) * 0.1;
                        }
                    }
                });
                this.x += sepX; this.y += sepY;

                if (this.cd > 0) this.cd--;

                if (this.type === 'medic') {
                    // 메딕: 힐링 AI
                    let hurtAlly = units.find(u => u !== this && u.hp < u.maxHp && getDist(this.x, this.y, u.x, u.y) < this.range);
                    if (hurtAlly && this.cd === 0) {
                        hurtAlly.hp = Math.min(hurtAlly.maxHp, hurtAlly.hp + 5); this.cd = this.cdTime;
                        healBeams.push({x1: this.x, y1: this.y, x2: hurtAlly.x, y2: hurtAlly.y, life: 10});
                    }
                } else {
                    // 마린 & 탱크: 자동 공격 AI
                    let nearestEnemy = null; let minDist = this.range;
                    enemies.forEach(e => { let d = getDist(this.x, this.y, e.x, e.y); if (d < minDist) { minDist = d; nearestEnemy = e; } });

                    if (nearestEnemy && this.cd === 0) {
                        let angle = getAngle(this.x, this.y, nearestEnemy.x, nearestEnemy.y);
                        bullets.push(new Bullet(this.x, this.y, angle, false, this.type === 'tank'));
                        this.cd = this.cdTime;
                    }
                }

                // 이동 (적이 사거리에 없거나 공격 쿨타임 중 이동 가능)
                if (this.isMoving) {
                    let d = getDist(this.x, this.y, this.targetX, this.targetY);
                    if (d > this.speed) {
                        let angle = getAngle(this.x, this.y, this.targetX, this.targetY);
                        this.x += Math.cos(angle) * this.speed; this.y += Math.sin(angle) * this.speed;
                    } else this.isMoving = false;
                }
                
                this.x = Math.max(20, Math.min(canvas.width - 20, this.x)); this.y = Math.max(20, Math.min(canvas.height - 20, this.y));
            }

            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.selected) {
                    ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2; ctx.beginPath();
                    ctx.ellipse(0, this.radius, this.radius + 6, (this.radius + 6) * 0.5, 0, 0, Math.PI * 2); ctx.stroke();
                }
                
                // 체력바
                ctx.fillStyle = '#f00'; ctx.fillRect(-12, -20, 24, 4);
                ctx.fillStyle = '#0f0'; ctx.fillRect(-12, -20, 24 * (this.hp / this.maxHp), 4);

                let lookAngle = this.isMoving ? getAngle(this.x, this.y, this.targetX, this.targetY) : 0;
                ctx.rotate(lookAngle);
                
                if (this.type === 'tank') {
                    ctx.fillStyle = this.color; ctx.fillRect(-12, -12, 24, 24); // 차체
                    ctx.fillStyle = '#444'; ctx.fillRect(0, -4, 25, 8); // 주포
                } else {
                    ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
                    if(this.type === 'medic') { ctx.fillStyle = '#f00'; ctx.fillRect(-6, -2, 12, 4); ctx.fillRect(-2, -6, 4, 12); } // 적십자 마크
                    else { ctx.fillStyle = '#333'; ctx.fillRect(5, -2, 12, 4); } // 소총
                }
                ctx.restore();
            }
        }

        // --- 적 유닛 (Zergling, Hydralisk, Baneling) ---
        class Enemy {
            constructor() {
                let side = Math.random();
                if (side < 0.25) { this.x = Math.random() * canvas.width; this.y = -20; }
                else if (side < 0.5) { this.x = canvas.width + 20; this.y = Math.random() * canvas.height; }
                else if (side < 0.75) { this.x = Math.random() * canvas.width; this.y = canvas.height + 20; }
                else { this.x = -20; this.y = Math.random() * canvas.height; }

                let rand = Math.random();
                if (rand < 0.6) this.type = 'zergling';
                else if (rand < 0.9) this.type = 'hydra';
                else this.type = 'baneling';

                this.cd = 0;
                if(this.type === 'zergling') { this.radius = 8; this.speed = 3.5 + wave*0.1; this.hp = 35 + wave*5; this.color = '#f30'; }
                if(this.type === 'hydra') { this.radius = 12; this.speed = 1.8; this.hp = 80 + wave*10; this.color = '#800080'; this.range = 250; this.cdTime = 60; }
                if(this.type === 'baneling') { this.radius = 10; this.speed = 2.8 + wave*0.1; this.hp = 30 + wave*5; this.color = '#0f0'; } // 초록색 자폭병
                this.maxHp = this.hp;
            }

            update() {
                let target = null; let minDist = Infinity;
                units.forEach(u => { let d = getDist(this.x, this.y, u.x, u.y); if (d < minDist) { minDist = d; target = u; } });

                if (target) {
                    let d = getDist(this.x, this.y, target.x, target.y);
                    
                    if (this.type === 'baneling') {
                        // 맹독충: 아군 근처 도달 시 자폭 (광역 피해)
                        if (d < 40) {
                            createExplosion(this.x, this.y, 70, '#0f0');
                            units.forEach(u => { if(getDist(this.x, this.y, u.x, u.y) < 70) damageUnit(u, 45); });
                            this.hp = 0; // 자폭
                        } else { moveTowards(this, target); }
                    } else if (this.type === 'hydra') {
                        // 히드라: 사거리 내 투사체 발사, 아니면 이동
                        if (d < this.range) {
                            if (this.cd <= 0) {
                                bullets.push(new Bullet(this.x, this.y, getAngle(this.x, this.y, target.x, target.y), true));
                                this.cd = this.cdTime;
                            }
                        } else { moveTowards(this, target); }
                    } else {
                        // 저글링: 근접 타격
                        if (d < this.radius + target.radius + 5) {
                            if (this.cd <= 0) { damageUnit(target, 6); this.cd = 30; }
                        } else { moveTowards(this, target); }
                    }
                }
                if (this.cd > 0) this.cd--;
            }

            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                let angle = units.length > 0 ? getAngle(this.x, this.y, units[0].x, units[0].y) : 0; ctx.rotate(angle);
                
                ctx.fillStyle = this.color;
                if(this.type === 'baneling') {
                    // 맥동하는 효과
                    ctx.shadowBlur = 15; ctx.shadowColor = '#0f0';
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + Math.sin(frameCount*0.2)*2, 0, Math.PI*2); ctx.fill();
                } else if(this.type === 'hydra') {
                    ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-10, 10); ctx.lineTo(-5, 0); ctx.lineTo(-10, -10); ctx.closePath(); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-5, 8); ctx.lineTo(-2, 0); ctx.lineTo(-5, -8); ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
        }

        function moveTowards(obj, target) {
            let angle = getAngle(obj.x, obj.y, target.x, target.y);
            obj.x += Math.cos(angle) * obj.speed; obj.y += Math.sin(angle) * obj.speed;
        }
        function damageUnit(u, amt) {
            u.hp -= amt; spawnParticles(u.x, u.y, '#f00', 3);
            if (u.hp <= 0 && units.includes(u)) { units.splice(units.indexOf(u), 1); if (units.length === 0) endGame(); }
        }

        // --- 투사체 (마린 총알, 탱크 포탄, 히드라 독침) ---
        class Bullet {
            constructor(x, y, angle, isEnemy=false, isTank=false) {
                this.x = x; this.y = y; this.vx = Math.cos(angle) * (isTank ? 10 : 15); this.vy = Math.sin(angle) * (isTank ? 10 : 15);
                this.isEnemy = isEnemy; this.isTank = isTank; this.active = true;
                this.damage = isTank ? 40 : (isEnemy ? 15 : 6);
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.active = false;

                if (this.isEnemy) {
                    for (let u of units) {
                        if (getDist(this.x, this.y, u.x, u.y) < u.radius + 5) { damageUnit(u, this.damage); this.active = false; break; }
                    }
                } else {
                    for (let i = 0; i < enemies.length; i++) {
                        let e = enemies[i];
                        if (getDist(this.x, this.y, e.x, e.y) < e.radius + 5) {
                            if(this.isTank) {
                                // 탱크 광역 스플래시 데미지 연산
                                createExplosion(this.x, this.y, 60, '#fa0');
                                enemies.forEach(otherE => { if(getDist(this.x, this.y, otherE.x, otherE.y) < 60) { otherE.hp -= this.damage; spawnParticles(otherE.x, otherE.y, otherE.color, 3); } });
                            } else {
                                e.hp -= this.damage; spawnParticles(e.x, e.y, e.color, 3);
                            }
                            this.active = false; break;
                        }
                    }
                }
            }
            draw() {
                ctx.fillStyle = this.isEnemy ? '#8f0' : (this.isTank ? '#fa0' : '#ff0');
                ctx.beginPath(); ctx.arc(this.x, this.y, this.isTank ? 4 : 2, 0, Math.PI*2); ctx.fill();
            }
        }

        // --- 파티클 시스템 ---
        class Particle {
            constructor(x, y, color) { this.x = x; this.y = y; let a = Math.random()*Math.PI*2, s = Math.random()*4; this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s; this.life = 1; this.color = color; }
            update() { this.vx *= 0.9; this.vy *= 0.9; this.x += this.vx; this.y += this.vy; this.life -= 0.05; }
            draw() { ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; }
        }
        function spawnParticles(x, y, color, cnt) { for(let i=0; i<cnt; i++) particles.push(new Particle(x, y, color)); }
        
        function createExplosion(x, y, radius, color) {
            ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill(); ctx.restore();
        }

        function endGame() { gameActive = false; document.getElementById('gameOver').style.display = 'block'; }

        // 초기 병력 세팅 (마린 12, 메딕 3, 탱크 3)
        for(let i=0; i<12; i++) units.push(new Unit(canvas.width/2 + (Math.random()-0.5)*100, canvas.height/2 + (Math.random()-0.5)*100, 'marine'));
        for(let i=0; i<3; i++) units.push(new Unit(canvas.width/2 + (Math.random()-0.5)*100, canvas.height/2 + (Math.random()-0.5)*100, 'medic'));
        for(let i=0; i<3; i++) units.push(new Unit(canvas.width/2 + (Math.random()-0.5)*100, canvas.height/2 + (Math.random()-0.5)*100, 'tank'));

        // --- 메인 루프 ---
        function loop() {
            if (!gameActive) return;
            frameCount++; ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 적 스폰
            if (frameCount % Math.max(20, 100 - wave * 5) === 0) enemies.push(new Enemy());
            if (frameCount % 500 === 0) wave++;
            
            document.getElementById('waveTxt').innerText = wave; document.getElementById('killTxt').innerText = kills;

            // 시각 효과 처리 (우클릭 마커, 힐 광선, 드래그 박스)
            for (let i = moveCommands.length - 1; i >= 0; i--) { let m = moveCommands[i]; ctx.strokeStyle = `rgba(0, 255, 0, ${m.life / 20})`; ctx.beginPath(); ctx.moveTo(m.x - 10, m.y); ctx.lineTo(m.x + 10, m.y); ctx.moveTo(m.x, m.y - 10); ctx.lineTo(m.x, m.y + 10); ctx.stroke(); m.life--; if (m.life <= 0) moveCommands.splice(i, 1); }
            for (let i = healBeams.length - 1; i >= 0; i--) { let h = healBeams[i]; ctx.strokeStyle = `rgba(255, 255, 255, ${h.life / 10})`; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(h.x1, h.y1); ctx.lineTo(h.x2, h.y2); ctx.stroke(); h.life--; if (h.life <= 0) healBeams.splice(i, 1); }
            if (isSelecting) { ctx.fillStyle = 'rgba(0, 255, 0, 0.1)'; ctx.strokeStyle = '#0f0'; let w = currentX - startX, h = currentY - startY; ctx.fillRect(startX, startY, w, h); ctx.strokeRect(startX, startY, w, h); }

            // 엔티티 업데이트 루프
            particles.forEach((p, i) => { p.update(); if (p.life <= 0) particles.splice(i, 1); else p.draw(); });
            bullets.forEach((b, i) => { b.update(); if (!b.active) bullets.splice(i, 1); else b.draw(); });
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i]; e.update();
                if (e.hp <= 0) { enemies.splice(i, 1); kills++; spawnParticles(e.x, e.y, e.color, 10); } else e.draw();
            }
            units.forEach(u => { u.update(); u.draw(); });

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
