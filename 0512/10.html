<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini League of Legends</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070a;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 게임 화면 중앙 정렬 */
        #gameContainer {
            position: relative;
            width: 1000px;
            height: 700px;
            margin: 20px auto;
            border: 3px solid #c8aa6e; /* 롤 테두리 색상 */
            box-shadow: 0 0 30px rgba(200, 170, 110, 0.3);
        }

        canvas {
            display: block;
            background: #111c24; /* 소환사의 협곡 느낌 어두운 바닥 */
        }

        /* 하단 스킬 및 상태 UI */
        #uiBar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(1, 10, 19, 0.9);
            border-top: 2px solid #c8aa6e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .stat-box {
            font-size: 16px;
            color: #a09e99;
        }
        .stat-box strong { color: #f0e6d2; }

        .skills-container {
            display: flex;
            gap: 15px;
        }

        .skill-slot {
            width: 50px;
            height: 50px;
            border: 2px solid #c8aa6e;
            background: #03141e;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #00e5ff;
            border-radius: 4px;
        }

        .skill-slot .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(0, 0, 0, 0.7);
            transition: height 0.1s linear;
        }

        .skill-slot .key-hint {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 11px;
            color: #c8aa6e;
        }

        /* 게임 오버 / 승리 알림 */
        .screen-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .screen-overlay h1 {
            font-size: 64px;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .victory h1 { color: #00e5ff; text-shadow: 0 0 20px #00e5ff; }
        .defeat h1 { color: #ff2a2a; text-shadow: 0 0 20px #ff2a2a; }

        button {
            padding: 10px 25px;
            background: #1e2328;
            border: 2px solid #c8aa6e;
            color: #c8aa6e;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #c8aa6e;
            color: #121212;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="victoryScreen" class="screen-overlay victory">
            <h1>VICTORY</h1>
            <button onclick="location.reload()">다시 하기</button>
        </div>
        <div id="defeatScreen" class="screen-overlay defeat">
            <h1>DEFEAT</h1>
            <button onclick="location.reload()">다시 하기</button>
        </div>

        <canvas id="lolCanvas" width="1000" height="620"></canvas>

        <div id="uiBar">
            <div class="stat-box">
                챔피언: <strong>이즈리얼 (Ezreal)</strong> <span id="levelTxt">[Lv.1]</span><br>
                CS: <span id="csTxt" style="color:#ffaa00;">0</span> | KILLS: <span id="killTxt" style="color:#ff2a2a;">0</span>
            </div>
            
            <div class="skills-container">
                <div class="skill-slot" id="skillQ">
                    <span class="key-hint">Q</span> 신비한 화살
                    <div class="cooldown-overlay" id="cooldownQ"></div>
                </div>
                <div class="skill-slot" id="skillR">
                    <span class="key-hint">R</span> 정조준 일격
                    <div class="cooldown-overlay" id="cooldownR"></div>
                </div>
            </div>

            <div class="stat-box" style="text-align: right;">
                목표: <strong>적 포탑과 넥서스를 파괴하세요!</strong><br>
                조종: <span style="color:#00e5ff;">우클릭(이동) / Q, R (스킬 사용)</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('lolCanvas');
        const ctx = canvas.getContext('2d');

        // 우클릭 메뉴 방지 (롤처럼 우클릭 이동을 쓰기 위함)
        window.addEventListener('contextmenu', e => e.preventDefault());

        // 게임 상태
        let gameActive = true;
        let score = { cs: 0, kills: 0 };
        let frameCount = 0;

        // 마우스 위치 및 클릭 핑 효과용 변수
        let mousePos = { x: 0, y: 0 };
        let clickPings = [];

        // 마우스 위치 추적
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;
        });

        // 우클릭으로 이동 명령
        canvas.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            if (e.button === 2) { // 우클릭
                player.targetX = mousePos.x;
                player.targetY = mousePos.y;
                
                // 클릭 평(이펙트) 추가
                clickPings.push({ x: mousePos.x, y: mousePos.y, radius: 2, alpha: 1 });
            }
        });

        // 키보드 스킬 사용 입력
        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key.toLowerCase() === 'q') player.useSkillQ();
            if (e.key.toLowerCase() === 'r') player.useSkillR();
        });

        // 체력바 그리기 공통 함수
        function drawHealthBar(x, y, width, height, current, max, color = '#22cc22') {
            ctx.fillStyle = '#333';
            ctx.fillRect(x - width/2, y, width, height);
            const hpWidth = Math.max(0, (current / max) * width);
            ctx.fillStyle = color;
            ctx.fillRect(x - width/2, y, hpWidth, height);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(x - width/2, y, width, height);
        }

        // --- 객체 정의 (클래스) ---

        // 1. 플레이어 (챔피언)
        class Champion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.radius = 18;
                this.speed = 3.5;
                this.hp = 500;
                this.maxHp = 500;
                this.level = 1;
                this.exp = 0;
                this.expToNextLevel = 100;
                
                // 스킬 쿨타임 관리 (밀리초)
                this.cooldowns = { Q: 0, R: 0 };
                this.maxCooldowns = { Q: 800, R: 7000 }; // Q: 0.8초, R: 7초
            }

            update() {
                // 이동 로직 (목표 지점으로 서서히 이동)
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > this.speed) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }

                // 쿨타임 감소
                if (this.cooldowns.Q > 0) this.cooldowns.Q -= 16.66; // 약 1프레임당 ms
                if (this.cooldowns.R > 0) this.cooldowns.R -= 16.66;
                
                // UI 쿨타임 반영
                document.getElementById('cooldownQ').style.height = `${Math.max(0, (this.cooldowns.Q / this.maxCooldowns.Q) * 100)}%`;
                document.getElementById('cooldownR').style.height = `${Math.max(0, (this.cooldowns.R / this.maxCooldowns.R) * 100)}%`;

                // 자동 평타 (사거리 내 가장 가까운 적 자동 공격)
                if (frameCount % 45 === 0) { this.autoAttack(); }
            }

            draw() {
                // 챔피언 본체
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00e5ff';
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;

                // 체력바 및 네임태그
                drawHealthBar(this.x, this.y - 32, 50, 6, this.hp, this.maxHp);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Lv.${this.level}`, this.x, this.y - 40);
            }

            autoAttack() {
                let target = null;
                let minDist = 200; // 평타 사거리

                // 미니언 중 타겟 탐색
                minions.forEach(m => {
                    let d = Math.hypot(m.x - this.x, m.y - this.y);
                    if (d < minDist) { minDist = d; target = m; }
                });
                // 타워가 사거리 내에 있으면 타워 우선 공격 가능
                if (!target && turret && Math.hypot(turret.x - this.x, turret.y - this.y) < 250) target = turret;
                if (!target && nexus && Math.hypot(nexus.x - this.x, nexus.y - this.y) < 250) target = nexus;

                if (target) {
                    const angle = Math.atan2(target.y - this.y, target.x - this.x);
                    projectiles.push(new Projectile(this.x, this.y, angle, 7, 15, '#ffaa00', 'player_aa'));
                }
            }

            useSkillQ() {
                if (this.cooldowns.Q <= 0) {
                    const angle = Math.atan2(mousePos.y - this.y, mousePos.x - this.x);
                    projectiles.push(new Projectile(this.x, this.y, angle, 12, 40, '#00e5ff', 'player_q', 400));
                    this.cooldowns.Q = this.maxCooldowns.Q;
                }
            }

            useSkillR() {
                if (this.cooldowns.R <= 0) {
                    const angle = Math.atan2(mousePos.y - this.y, mousePos.x - this.x);
                    // 거대하고 강력한 투사체 (관통형태로 구현하기 위해 데미지 로직 조정)
                    projectiles.push(new Projectile(this.x, this.y, angle, 9, 150, '#ff00aa', 'player_r', 800));
                    this.cooldowns.R = this.maxCooldowns.R;
                }
            }

            gainExp(amount) {
                this.exp += amount;
                if (this.exp >= this.expToNextLevel) {
                    this.level++;
                    this.exp -= this.expToNextLevel;
                    this.maxHp += 80;
                    this.hp = this.maxHp; // 레벨업 시 풀피
                    document.getElementById('levelTxt').innerText = `[Lv.${this.level}]`;
                }
            }
        }

        // 2. 투사체 (평타, 스킬, 포탑 공격)
        class Projectile {
            constructor(x, y, angle, speed, damage, color, type, range = 300) {
                this.x = x;
                this.y = y;
                this.startX = x;
                this.startY = y;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.damage = damage;
                this.color = color;
                this.type = type; // 'player_aa', 'player_q', 'player_r', 'turret'
                this.range = range;
                this.radius = type === 'player_r' ? 15 : 5;
                this.active = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // 사거리 이탈 시 제거
                if (Math.hypot(this.x - this.startX, this.y - this.startY) > this.range) {
                    this.active = false;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = this.radius * 2;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
            }
        }

        // 3. 적 미니언
        class Minion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.speed = 1.2;
                this.hp = 90;
                this.maxHp = 90;
                this.damage = 8;
            }

            update() {
                // 플레이어를 향해 걸어옴
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 40) { // 플레이어 근처까지 이동
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                } else {
                    // 초근접 시 플레이어 공격
                    if (frameCount % 60 === 0) {
                        player.hp -= this.damage;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff4444';
                ctx.fill();
                ctx.closePath();

                drawHealthBar(this.x, this.y - 20, 24, 4, this.hp, this.maxHp, '#ff4444');
            }
        }

        // 4. 적 포탑 (타워)
        class Turret {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 35;
                this.hp = 800;
                this.maxHp = 800;
                this.range = 220;
                this.fireRate = 60; // 1초에 한 번 사격
                this.cooldown = 0;
            }

            update() {
                if (this.cooldown > 0) this.cooldown--;

                // 사거리 내 플레이어가 있으면 공격
                const dist = Math.hypot(player.x - this.x, player.y - this.y);
                if (dist < this.range && this.cooldown === 0) {
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    projectiles.push(new Projectile(this.x, this.y, angle, 5, 45, '#ff1111', 'turret', this.range + 50));
                    this.cooldown = this.fireRate;
                }
            }

            draw() {
                // 사정거리 가이드라인 (플레이어가 근처에 오면 붉은색 활성화)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
                ctx.strokeStyle = Math.hypot(player.x - this.x, player.y - this.y) < this.range ? 'rgba(255,0,0,0.2)' : 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();

                // 포탑 외형
                ctx.fillStyle = '#4a5568';
                ctx.fillRect(this.x - 25, this.y - 25, 50, 50);
                ctx.fillStyle = '#2d3748';
                ctx.fillRect(this.x - 15, this.y - 15, 30, 30);

                // 체력바
                drawHealthBar(this.x, this.y - 40, 70, 8, this.hp, this.maxHp, '#ff2a2a');
                ctx.fillStyle = '#fff';
                ctx.font = '11px Arial';
                ctx.fillText("적 포탑", this.x, this.y - 45);
            }
        }

        // 5. 적 넥서스 (최종 기지)
        class Nexus {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 45;
                this.hp = 1200;
                this.maxHp = 1200;
            }
            draw() {
                ctx.beginPath();
                // 다각형 넥서스 모양 그리기
                ctx.moveTo(this.x, this.y - this.radius);
                ctx.lineTo(this.x + this.radius, this.y);
                ctx.lineTo(this.x, this.y + this.radius);
                ctx.lineTo(this.x - this.radius, this.y);
                ctx.closePath();
                ctx.fillStyle = '#8a0000';
                ctx.fill();
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 3;
                ctx.stroke();

                drawHealthBar(this.x, this.y - 60, 90, 10, this.hp, this.maxHp, '#ff2a2a');
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 13px Arial';
                ctx.fillText("적 넥서스", this.x, this.y - 65);
            }
        }

        // --- 인스턴스 생성 및 초기화 ---
        const player = new Champion(850, 500); // 아군 기지 위치 (우하단)
        let turret = new Turret(450, 280);     // 중앙 포탑
        let nexus = new Nexus(150, 120);       // 적 본진 (좌상단)
        
        let minions = [];
        let projectiles = [];

        // 미니언 스폰 스케줄러 (적 본진에서 리스폰되어 개떼처럼 내려옴)
        function spawnMinions() {
            if (!gameActive) return;
            for(let i=0; i<3; i++) {
                // 약간의 오차를 두고 스폰
                minions.push(new Minion(nexus.x + (Math.random()-0.5)*40, nexus.y + (Math.random()-0.5)*40));
            }
        }
        setInterval(spawnMinions, 6000); // 6초마다 한 웨이브(3마리) 스폰
        spawnMinions(); // 시작하자마자 첫 웨이브

        // --- 메인 게임 루프 ---
        function loop() {
            if (!gameActive) return;
            frameCount++;

            // 1. 화면 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 지형 그래픽 효과 (본진 영역 구분선 간단히)
            ctx.strokeStyle = 'rgba(200, 170, 110, 0.1)';
            ctx.lineWidth = 5;
            ctx.strokeRect(10, 10, canvas.width-20, canvas.height-20);

            // 2. 우클릭 핑 애니메이션 관리 및 드로잉
            clickPings.forEach((ping, index) => {
                ctx.beginPath();
                ctx.arc(ping.x, ping.y, ping.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 100, ${ping.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
                
                ping.radius += 1.5;
                ping.alpha -= 0.05;
                if (ping.alpha <= 0) clickPings.splice(index, 1);
            });

            // 3. 플레이어 업데이트
            player.update();
            player.draw();

            // 패배 조건 검사
            if (player.hp <= 0) {
                gameActive = false;
                document.getElementById('defeatScreen').style.display = 'flex';
            }

            // 4. 적 타워 & 넥서스 업데이트
            if (turret) {
                turret.update();
                turret.draw();
                if (turret.hp <= 0) {
                    turret = null; // 타워 파괴
                    score.kills++;
                    player.gainExp(150);
                }
            }
            if (nexus) {
                nexus.draw();
                if (nexus.hp <= 0) {
                    gameActive = false; // 승리
                    document.getElementById('victoryScreen').style.display = 'flex';
                }
            }

            // 5. 미니언 업데이트
            minions.forEach((minion, mIdx) => {
                minion.update();
                minion.draw();

                // 미니언 사망 처리
                if (minion.hp <= 0) {
                    minions.splice(mIdx, 1);
                    score.cs++;
                    player.gainExp(35); // 경험치 획득
                    document.getElementById('csTxt').innerText = score.cs;
                }
            });

            // 6. 투사체 업데이트 및 충돌 체크
            projectiles.forEach((proj, pIdx) => {
                proj.update();
                proj.draw();

                if (!proj.active) {
                    projectiles.splice(pIdx, 1);
                    return;
                }

                // 6-1. 플레이어 투사체가 적에게 맞는 경우
                if (proj.type.startsWith('player')) {
                    // 미니언 충돌
                    minions.forEach(minion => {
                        if (Math.hypot(proj.x - minion.x, proj.y - minion.y) < minion.radius + proj.radius) {
                            minion.hp -= proj.damage;
                            if (proj.type !== 'player_r') proj.active = false; // 궁극기(R)는 모든 적을 관통함!
                        }
                    });

                    // 포탑 충돌 (앞에 타워가 깨져야 넥서스 타격 가능하게 롤 룰 적용)
                    if (turret && Math.hypot(proj.x - turret.x, proj.y - turret.y) < turret.radius + proj.radius) {
                        turret.hp -= proj.damage;
                        if (proj.type !== 'player_r') proj.active = false;
                    } 
                    // 넥서스 충돌
                    else if (!turret && nexus && Math.hypot(proj.x - nexus.x, proj.y - nexus.y) < nexus.radius + proj.radius) {
                        nexus.hp -= proj.damage;
                        if (proj.type !== 'player_r') proj.active = false;
                    }
                } 
                // 6-2. 포탑 투사체가 플레이어에게 맞는 경우
                else if (proj.type === 'turret') {
                    if (Math.hypot(proj.x - player.x, proj.y - player.y) < player.radius + proj.radius) {
                        player.hp -= proj.damage;
                        proj.active = false;
                    }
                }

                // 비활성화된 투사체 정리
                if (!proj.active) projectiles.splice(pIdx, 1);
            });

            requestAnimationFrame(loop);
        }

        // 게임 시작
        loop();
